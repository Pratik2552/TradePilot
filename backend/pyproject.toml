[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradepilot-backend"
version = "1.0.0"
description = "TradePilot Quantitative Research Platform — FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "yfinance>=0.2.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]